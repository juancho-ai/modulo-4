<ActionBar class="action-bar">
  <NavigationButton ios:visibility="collapsed" icon="res://menu" (tap)="onDrawerButtonTap()"></NavigationButton>
  <ActionItem icon="res://menu" android:visibility="collapsed" (tap)="onDrawerButtonTap()" ios.position="left"></ActionItem>
  <Label text="Firebase Cloud Messaging"></Label>
</ActionBar>

<ScrollView>
  <StackLayout class="fb-page">
    <!-- Requisito 1: Mostrar el token asignado de Google Firebase -->
    <StackLayout class="token-card">
      <Label text="Token de Registro FCM (Google Firebase)" class="card-title"></Label>
      <Label
        text="Usa este token en Firebase Console -> Cloud Messaging -> Enviar mensaje de prueba:"
        textWrap="true"
        class="card-subtitle"
      ></Label>

      <TextView
        [text]="(tokenFirebase$ | async)"
        editable="false"
        class="token-box"
      ></TextView>

      <Button text="Compartir Token FCM" (tap)="copiarOCompartirToken()" class="btn-token"></Button>
    </StackLayout>

    <!-- Requisito 2: Notificaciones entrantes mostradas vía Toast -->
    <StackLayout class="notif-card">
      <Label text="Notificaciones Entrantes (Toast)" class="card-title"></Label>
      <Label
        text="Cuando llega una notificación desde Firebase se despliega automáticamente un Toast en pantalla."
        textWrap="true"
        class="card-subtitle"
      ></Label>
      <Button text="Probar Toast de Notificación" (tap)="probarToastNotificacion()" class="btn-toast"></Button>

      <StackLayout *ngFor="let n of (notificaciones$ | async)" class="notif-item">
        <Label [text]="n.titulo + ' (' + n.fecha + ')'" class="notif-titulo"></Label>
        <Label [text]="n.cuerpo" textWrap="true" class="notif-cuerpo"></Label>
      </StackLayout>
    </StackLayout>
  </StackLayout>
</ScrollView>
